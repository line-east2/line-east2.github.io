<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Line East2 Open JC Analysis</title>
<script src="config.js"></script>
<style>
:root{--navy:#0b2545;--navy2:#13315c;--blue:#1d64d8;--bg:#f3f5f9;--card:#fff;--line:#dde3ec;--text:#1b2433;--muted:#667085;
--green:#12805c;--greenbg:#e3f5ec;--amber:#b45309;--amberbg:#fef3c7;--red:#c0262d;--redbg:#fde8e8;--ev:#0e7c86;--pv:#3949ab}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}
header .sub{font-size:12px;opacity:.8}
header .sp{flex:1}
header button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3)}
main{max-width:1320px;margin:0 auto;padding:16px}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 14px;cursor:pointer;color:var(--text)}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
button.danger{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;border:1px solid #c9d2df;border-radius:7px;padding:7px 9px;background:#fff;color:var(--text);max-width:100%}
textarea{width:100%;resize:vertical;min-height:38px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--navy)}
.card h2 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.center{max-width:420px;margin:50px auto}
.center input{width:100%;margin-bottom:10px}
.msg{padding:9px 12px;border-radius:7px;margin:8px 0;font-size:13px}
.msg.err{background:var(--redbg);color:var(--red)}
.msg.ok{background:var(--greenbg);color:var(--green)}
.msg.warn{background:var(--amberbg);color:var(--amber)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters select{min-width:150px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;border-left:4px solid var(--blue)}
.kpi .v{font-size:23px;font-weight:700;color:var(--navy)}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.kpi.g{border-left-color:var(--green)}.kpi.a{border-left-color:#e0a106}.kpi.r{border-left-color:var(--red)}.kpi.t{border-left-color:var(--ev)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tw{overflow:auto;max-height:560px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid #edf0f5;text-align:right;white-space:nowrap}
th{background:#f0f3f8;color:#344054;position:sticky;top:0;z-index:1;font-weight:600}
th:first-child,td:first-child,td.l,th.l{text-align:left}
tr.tot td{font-weight:700;background:#f7f9fc;border-top:2px solid #cfd8e3}
tr.sub td{background:#fbfcfe;color:#475467;font-size:12px}
tr.sub td:first-child{padding-left:26px}
tr.click{cursor:pointer}
tr.click:hover td{background:#f5f8ff}
.bar{height:9px;background:#e8edf5;border-radius:5px;min-width:80px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:5px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
.pill.pv{background:#e8eaf6;color:var(--pv)}.pill.ev{background:#e0f2f1;color:var(--ev)}
.pill.ok{background:var(--greenbg);color:var(--green)}.pill.pen{background:var(--redbg);color:var(--red)}.pill.uns{background:var(--amberbg);color:var(--amber)}
.age{display:inline-block;min-width:44px;text-align:center;padding:1px 7px;border-radius:10px;font-weight:700;font-size:12px}
.a1{background:#e3f5ec;color:#12805c}.a2{background:#fff4d6;color:#9a6b00}.a3{background:#ffe6cc;color:#b45309}.a4{background:#fde8e8;color:#c0262d}.a5{background:#f6d5d7;color:#8f1d22}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;background:#eef2f7}
.stack span{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* CCM cards */
.jc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;border-left:4px solid #c9d2df}
.jc.done{border-left-color:var(--green)}.jc.dirty{border-left-color:#e0a106;background:#fffdf5}.jc.bad{border-left-color:var(--red)}
.jc .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.jc .top b{font-size:14px}
.jc .info{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:3px 14px;font-size:12.5px;margin-bottom:8px}
.jc .info span{color:var(--muted)}
.jc .dms{background:#f6f8fb;border-radius:7px;padding:7px 9px;font-size:12.5px;margin-bottom:8px}
.jc .inp{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
@media(max-width:760px){.jc .inp{grid-template-columns:1fr}}
.jc .inp select{width:100%}
.jc .meta{font-size:11.5px;color:var(--muted);margin-top:5px}
.savebar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 -3px 10px rgba(0,0,0,.05);z-index:5;margin:0 -16px}
.savebar .st{flex:1;font-size:13px}
.prog{height:8px;background:#e8edf5;border-radius:5px;overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;background:var(--green)}
.hidden{display:none!important}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #c9d2df;border-top-color:var(--blue);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.heat0{background:transparent}
@media(max-width:640px){
  main{padding:10px}header{padding:10px 14px}header h1{font-size:16px}
  .filters{padding:10px}.filters .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .filters select,.filters input{min-width:0;width:100%}
  .kpis{grid-template-columns:repeat(3,1fr);gap:6px}.kpi{padding:7px 8px}.kpi .v{font-size:18px}.kpi .l{font-size:10px}
  .jc{padding:10px}.jc .info{grid-template-columns:1fr 1fr;font-size:12px}
  .savebar{margin:0 -10px;padding:8px 10px}
}
.linkbox{font-family:Consolas,monospace;background:#f6f8fb;padding:6px 9px;border-radius:6px;word-break:break-all;font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="appTitle">Line East2 Open JC Analysis</h1>
    <div class="sub" id="hdrSub">&nbsp;</div>
  </div>
  <div class="sp"></div>
  <div id="hdrBtns"></div>
</header>
<main id="app"><div class="center muted"><span class="spin"></span> Loading…</div></main>

<script>
'use strict';
/* =============================== common =============================== */
const CFG = window.PORTAL_CONFIG || {};
const API = CFG.api || '';
const TITLE = CFG.title || 'Line East2 Open JC Analysis';
document.title = TITLE; document.getElementById('appTitle').textContent = TITLE;
const IS_ADMIN = new URLSearchParams(location.search).get('page') === 'admin';
const $app = document.getElementById('app');
const AGE_BUCKETS = ['0-2', '3-7', '8-15', '16-30', '31-60', '>60'];
const AGE_COLORS = ['#7cc6a4', '#f3c64f', '#f39c4a', '#e5676c', '#b6363c', '#6d1a1e'];
const NOT_BINNED = 'Not yet binned';

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function prettyBin(b) { return String(b || '').replace(/_/g, ' '); }
function num(v) { const n = Number(v); return isFinite(n) ? n : 0; }
function ageOf(r) { return num(r['JC Open Days']); }
function bucketOf(d) { return d <= 2 ? 0 : d <= 7 ? 1 : d <= 15 ? 2 : d <= 30 ? 3 : d <= 60 ? 4 : 5; }
function ageCls(d) { return 'a' + (d <= 2 ? 1 : d <= 7 ? 2 : d <= 15 ? 3 : d <= 30 ? 4 : 5); }
function fmtD(s) {
  s = String(s || ''); const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return s; const mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+m[2] - 1];
  return m[3] + '-' + mon + '-' + m[1].slice(2);
}
function pct(a, b) { return b ? Math.round(a * 1000 / b) / 10 : 0; }
function uniq(a) { return [...new Set(a.filter(x => x !== '' && x != null))].sort((x, y) => String(x).localeCompare(String(y))); }
function opts(list, sel, all) { return (all ? `<option value="">${esc(all)}</option>` : '') + list.map(v => `<option value="${esc(v)}"${v === sel ? ' selected' : ''}>${esc(v)}</option>`).join(''); }
function isBinned(r) { return !!String(r['Binning'] || '').trim(); }

class NetError extends Error {}
async function api(action, payload, timeoutMs) {
  if (!API) throw new Error('The portal is not connected to its back-end yet (config.js has no API address).');
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeoutMs || 60000);
  let res;
  try {
    res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action }, payload || {})), signal: ctl.signal, redirect: 'follow' });
  } catch (e) { throw new NetError('Network problem – could not reach the server.'); }
  finally { clearTimeout(t); }
  if (!res.ok) throw new NetError('Server not reachable (HTTP ' + res.status + ').');
  let j; try { j = await res.json(); } catch (e) { throw new NetError('Unexpected reply from server.'); }
  if (!j.ok) { const er = new Error(j.error || 'Error'); er.code = j.error; throw er; }
  return j;
}
function hdr(sub, btns) {
  document.getElementById('hdrSub').innerHTML = sub || '&nbsp;';
  document.getElementById('hdrBtns').innerHTML = btns || '';
}

/* ============================ aggregation ============================= */
function groupStats(rows, keyFn) {
  const m = new Map();
  rows.forEach(r => {
    const k = keyFn(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r);
  });
  return [...m.entries()].map(([k, rs]) => statOf(k, rs));
}
function statOf(k, rs) {
  const s = { key: k, total: rs.length, pv: 0, ev: 0, upd: 0, pen: 0, gt7: 0, gt30: 0, sumAge: 0, b: AGE_BUCKETS.map(() => 0), bins: {} };
  rs.forEach(r => {
    const a = ageOf(r); s.sumAge += a;
    if (r['Segment'] === 'EV') s.ev++; else s.pv++;
    if (isBinned(r)) s.upd++; else s.pen++;
    if (a > 7) s.gt7++; if (a > 30) s.gt30++;
    s.b[bucketOf(a)]++;
    const bn = isBinned(r) ? r['Binning'] : NOT_BINNED; s.bins[bn] = (s.bins[bn] || 0) + 1;
  });
  s.avg = rs.length ? Math.round(s.sumAge / rs.length * 10) / 10 : 0;
  s.fill = pct(s.upd, s.total);
  const top = Object.entries(s.bins).filter(e => e[0] !== NOT_BINNED).sort((a, b) => b[1] - a[1])[0];
  s.topBin = top ? prettyBin(top[0]) + ' (' + top[1] + ')' : '–';
  s.rows = rs;
  return s;
}
function binOrder(taxonomy, rows) {
  const names = taxonomy.map(b => b.name);
  rows.forEach(r => { if (isBinned(r) && !names.includes(r['Binning'])) names.push(r['Binning']); });
  return names.concat([NOT_BINNED]);
}

/* =============================== CCM page ============================= */
const CCM = {
  code: store.get('ejc_code', ''), rows: [], tax: [], last: null, drafts: store.get('ejc_drafts_v1', {}),
  f: store.get('ejc_ccm_filters', { ccm: '', seg: '', dealer: '', div: '', show: 'pending', q: '' }),
  saving: false, retryTimer: null, limit: 60, byJc: {}
};

async function ccmStart() {
  hdr('Open JC update – for CCMs');
  if (!CCM.code) return ccmCodeScreen();
  $app.innerHTML = '<div class="center muted"><span class="spin"></span> Loading open JCs…</div>';
  try {
    const d = await api('ccmData', { code: CCM.code });
    CCM.rows = d.rows; CCM.tax = d.taxonomy; CCM.last = d.lastUpload;
    store.set('ejc_ccm_cache', { rows: d.rows, tax: d.taxonomy, last: d.lastUpload, at: Date.now() });
    ccmReady(false);
  } catch (e) {
    if (e.code === 'WRONG_CODE') { CCM.code = ''; store.del('ejc_code'); return ccmCodeScreen('That access code is not valid any more. Please enter the current code.'); }
    const c = store.get('ejc_ccm_cache', null);
    if (e instanceof NetError && c) {
      CCM.rows = c.rows; CCM.tax = c.tax; CCM.last = c.last; ccmReady(true);
    } else {
      $app.innerHTML = `<div class="center card"><div class="msg err">${esc(e.message)}</div><button class="pri" onclick="ccmStart()">Try again</button></div>`;
    }
  }
}
function ccmCodeScreen(msg) {
  $app.innerHTML = `<div class="center card"><h2>CCM access</h2>
  <p class="muted">Enter the access code shared by your Regional Customer Care Manager.</p>
  ${msg ? `<div class="msg err">${esc(msg)}</div>` : ''}
  <input id="cc" type="password" placeholder="Access code" autocomplete="off">
  <button class="pri" id="ccb" style="width:100%">Continue</button><div id="ccm_m"></div></div>`;
  const go = async () => {
    const v = document.getElementById('cc').value.trim(); if (!v) return;
    const b = document.getElementById('ccb'); b.disabled = true;
    try { await api('ccmCheck', { code: v }); CCM.code = v; store.set('ejc_code', v); ccmStart(); }
    catch (e) { b.disabled = false; document.getElementById('ccm_m').innerHTML = `<div class="msg err">${esc(e.code === 'WRONG_CODE' ? 'Wrong access code.' : e.message)}</div>`; }
  };
  document.getElementById('ccb').onclick = go;
  document.getElementById('cc').onkeydown = e => { if (e.key === 'Enter') go(); };
}

function ccmReady(offline) {
  CCM.byJc = {}; CCM.rows.forEach(r => { CCM.byJc[r['JC #']] = r; });
  // drop drafts for JCs no longer open, and drafts already equal to the saved values
  let dropped = 0;
  Object.keys(CCM.drafts).forEach(jc => {
    const r = CCM.byJc[jc];
    if (!r) { delete CCM.drafts[jc]; dropped++; return; }
    const d = CCM.drafts[jc];
    if (d.bin === (r['Binning'] || '') && d.sub === (r['Sub Binning'] || '') && d.remark === (r['CCM remark'] || '')) delete CCM.drafts[jc];
  });
  saveDrafts();
  const ccms = uniq(CCM.rows.map(r => r['CCM']));
  if (CCM.f.ccm && !ccms.includes(CCM.f.ccm)) CCM.f.ccm = '';
  const L = CCM.last;
  hdr(L ? `Data as on <b>${esc(fmtD(L.dataDate))}</b> · ${CCM.rows.length} open JCs` : 'No data uploaded yet',
    `<button onclick="ccmLogout()">Change code</button>`);
  $app.innerHTML = `
  ${offline ? `<div class="msg warn">You are offline – showing the copy saved on this device. Your changes are kept here and will be saved when the network is back.</div>` : ''}
  ${dropped ? `<div class="msg warn">${dropped} unsaved change(s) were for JCs that are no longer open in the latest data, so they were removed.</div>` : ''}
  <div id="resumeMsg"></div>
  <div class="card filters">
    <div class="row">
      <label class="f">CCM *<select id="fCcm">${opts(ccms, CCM.f.ccm, '— Select your name —')}</select></label>
      <label class="f">Segment<select id="fSeg"></select></label>
      <label class="f">Dealer<select id="fDealer"></select></label>
      <label class="f">Division<select id="fDiv"></select></label>
      <label class="f">Show<select id="fShow">${opts(['pending', 'updated', 'all', 'unsaved'], CCM.f.show).replace('>pending<', '>Pending update<').replace('>updated<', '>Already updated<').replace('>all<', '>All<').replace('>unsaved<', '>Unsaved on this device<')}</select></label>
      <label class="f">Search JC / Reg / Chassis<input id="fQ" value="${esc(CCM.f.q)}" placeholder="Type to search"></label>
    </div>
  </div>
  <div id="ccmSum"></div>
  <div id="ccmList"></div>
  <div class="savebar"><div class="st" id="saveSt"></div><button class="pri" id="saveBtn">Save</button></div>`;
  ['fCcm', 'fSeg', 'fDealer', 'fDiv', 'fShow'].forEach(id => document.getElementById(id).onchange = ccmFilterChanged);
  let qt; document.getElementById('fQ').oninput = () => { clearTimeout(qt); qt = setTimeout(ccmFilterChanged, 250); };
  document.getElementById('saveBtn').onclick = () => ccmSave(false);
  const list = document.getElementById('ccmList');
  list.addEventListener('change', ccmFieldChanged);
  list.addEventListener('input', e => { if (e.target.tagName === 'TEXTAREA') ccmFieldChanged(e); });
  ccmFillFilterOpts(); ccmRender();
  // Resume an interrupted save automatically
  if (!offline && store.get('ejc_save_pending', false) && Object.keys(CCM.drafts).length) {
    document.getElementById('resumeMsg').innerHTML = `<div class="msg warn">Resuming your last save that was interrupted…</div>`;
    setTimeout(() => ccmSave(true), 600);
  }
}
function ccmLogout() { CCM.code = ''; store.del('ejc_code'); ccmCodeScreen(); }

function ccmBase() { return CCM.rows.filter(r => !CCM.f.ccm || r['CCM'] === CCM.f.ccm); }
function ccmFillFilterOpts() {
  const f = CCM.f, base = ccmBase();
  const segs = uniq(base.map(r => r['Segment'])); if (!segs.includes(f.seg)) f.seg = '';
  const b2 = base.filter(r => !f.seg || r['Segment'] === f.seg);
  const dealers = uniq(b2.map(r => r['Dealer'])); if (!dealers.includes(f.dealer)) f.dealer = '';
  const b3 = b2.filter(r => !f.dealer || r['Dealer'] === f.dealer);
  const divs = uniq(b3.map(r => r['Division'])); if (!divs.includes(f.div)) f.div = '';
  document.getElementById('fSeg').innerHTML = opts(segs, f.seg, 'All');
  document.getElementById('fDealer').innerHTML = opts(dealers, f.dealer, 'All dealers');
  document.getElementById('fDiv').innerHTML = opts(divs, f.div, 'All divisions');
}
function ccmFilterChanged() {
  const f = CCM.f;
  f.ccm = document.getElementById('fCcm').value; f.seg = document.getElementById('fSeg').value;
  f.dealer = document.getElementById('fDealer').value; f.div = document.getElementById('fDiv').value;
  f.show = document.getElementById('fShow').value; f.q = document.getElementById('fQ').value.trim();
  store.set('ejc_ccm_filters', f); CCM.limit = 60;
  ccmFillFilterOpts(); ccmRender();
}
function curVal(r) {
  const d = CCM.drafts[r['JC #']];
  return d ? d : { bin: r['Binning'] || '', sub: r['Sub Binning'] || '', remark: r['CCM remark'] || '' };
}
function ccmFiltered() {
  const f = CCM.f, q = f.q.toLowerCase();
  return ccmBase().filter(r => (!f.seg || r['Segment'] === f.seg) && (!f.dealer || r['Dealer'] === f.dealer) && (!f.div || r['Division'] === f.div)
    && (!q || [r['JC #'], r['Registration No'], r['Chassis No']].join(' ').toLowerCase().includes(q))
    && (f.show === 'all' || (f.show === 'pending' && !isBinned(r)) || (f.show === 'updated' && isBinned(r)) || (f.show === 'unsaved' && CCM.drafts[r['JC #']])))
    .sort((a, b) => ageOf(b) - ageOf(a));
}
function binOpts(seg, sel) {
  const list = CCM.tax.filter(b => !(b.evOnly && seg !== 'EV')).map(b => b.name);
  if (sel && !list.includes(sel)) list.push(sel);
  return `<option value="">— Binning —</option>` + list.map(b => `<option value="${esc(b)}"${b === sel ? ' selected' : ''}>${esc(prettyBin(b))}</option>`).join('');
}
function subOpts(bin, sel) {
  const b = CCM.tax.find(x => x.name === bin); const list = b ? b.subs.slice() : [];
  if (sel && !list.includes(sel)) list.push(sel);
  return `<option value="">${bin ? '— Sub binning —' : '— choose Binning first —'}</option>` + list.map(s => `<option value="${esc(s)}"${s === sel ? ' selected' : ''}>${esc(s)}</option>`).join('');
}
function ccmRender() {
  const sum = document.getElementById('ccmSum'), list = document.getElementById('ccmList');
  if (!CCM.f.ccm) {
    sum.innerHTML = ''; list.innerHTML = `<div class="card muted">Select your name in the <b>CCM</b> list to see your open JCs.</div>`; ccmSaveStatus(); return;
  }
  const base = ccmBase(), done = base.filter(isBinned).length;
  const unsaved = base.filter(r => CCM.drafts[r['JC #']]).length;
  sum.innerHTML = `<div class="kpis">

function ccmSaveStatus(extra) {

const CHUNK = 25;
async function ccmSave(isResume) {
  if (CCM.saving) return;
  clearTimeout(CCM.retryTimer);
  const jcs = Object.keys(CCM.drafts).filter(j => !CCM.drafts[j].bad);
  if (!jcs.length) { store.del('ejc_save_pending'); ccmSaveStatus(); return; }
  if (!CCM.f.ccm && !isResume) { alert('Select your name in the CCM list first.'); return; }
  const by = CCM.f.ccm || store.get('ejc_ccm_filters', {}).ccm || 'CCM';
  CCM.saving = true; store.set('ejc_save_pending', true);
  let done = 0, gone = 0, invalid = 0;
  const total = jcs.length;
  try {
    for (let i = 0; i < jcs.length; i += CHUNK) {
      const part = jcs.slice(i, i + CHUNK).filter(j => CCM.drafts[j]);
      ccmSaveStatus(`<span class="spin"></span> Saving ${done + 1}–${Math.min(done + part.length, total)} of ${total}…`);
      const sent = part.map(j => ({ jc: j, bin: CCM.drafts[j].bin, sub: CCM.drafts[j].sub, remark: CCM.drafts[j].remark, t: CCM.drafts[j].t }));
      const res = await api('ccmSave', { code: CCM.code, ccm: by, updates: sent }, 45000);
      res.saved.forEach(j => {
        const r = CCM.byJc[j], d = sent.find(x => x.jc === j);
        if (r && d) { r['Binning'] = d.bin; r['Sub Binning'] = d.sub; r['CCM remark'] = d.remark; r['Updated By'] = by; r['Updated At'] = res.savedAt; }
        // only clear the draft if it was not edited again while saving
        if (CCM.drafts[j] && CCM.drafts[j].t === d.t) delete CCM.drafts[j];
      });
      res.notFound.forEach(j => { delete CCM.drafts[j]; gone++; });
      invalid += res.invalid.length;
      res.invalid.forEach(j => { if (CCM.drafts[j]) CCM.drafts[j].bad = true; });
      done += part.length;
      saveDrafts();
      store.set('ejc_ccm_cache', { rows: CCM.rows, tax: CCM.tax, last: CCM.last, at: Date.now() });
    }
    CCM.saving = false; store.del('ejc_save_pending');
    ccmRender();
    let m = `<span style="color:var(--green);font-weight:600">✔ Saved ${done - gone - invalid} JC(s).</span>`;
    if (gone) m += ` ${gone} JC(s) were already closed in the latest data and were skipped.`;
    if (invalid) m += ` <span style="color:var(--red)">${invalid} had a binning value that is no longer in the list – please choose again.</span>`;
    ccmSaveStatus(m);
    const rm = document.getElementById('resumeMsg'); if (rm) rm.innerHTML = '';
  } catch (e) {
    CCM.saving = false;
    ccmRender();
    if (e.code === 'WRONG_CODE') { ccmSaveStatus(`<span style="color:var(--red)">The access code has changed. Your changes are kept on this device. Click "Change code" and enter the new code, then Save.</span>`); return; }
    if (e instanceof NetError) {
      ccmSaveStatus(`<span style="color:var(--amber);font-weight:600">⚠ Network issue – saved ${done} of ${total}. The rest (${total - done}) are kept on this device and will be sent automatically when the network is back.</span>`);
      CCM.retryTimer = setTimeout(() => ccmSave(true), 20000);
      return;
    }
    ccmSaveStatus(`<span style="color:var(--red)">${esc(e.message)}</span>`);
  }
}

function heat(v, max) {

function ragFill(p) { return p >= 90 ? 'color:var(--green)' : p >= 60 ? 'color:var(--amber)' : 'color:var(--red)'; }
function tblGroup(stats, label, S, showSeg, showTop) {

}
function tblBinAge(rows) {
  const order = binOrder(ADM.tax, rows), tot = rows.length;
  const g = {}; order.forEach(b => g[b] = { b: AGE_BUCKETS.map(() => 0), n: 0, subs: {} });
  rows.forEach(r => {
    const bn = isBinned(r) ? r['Binning'] : NOT_BINNED, k = bucketOf(ageOf(r)); const x = g[bn];
    x.b[k]++; x.n++;
    const sb = isBinned(r) ? (r['Sub Binning'] || '(no sub-bin)') : null;
    if (sb) { x.subs[sb] = x.subs[sb] || AGE_BUCKETS.map(() => 0); x.subs[sb][k]++; }
  });
  const max = Math.max(1, ...order.flatMap(b => g[b].b));
  let h = `<table><thead><tr><th class="l">Binning</th>${AGE_BUCKETS.map(a => `<th>${a} d</th>`).join('')}<th>Total</th><th>Share</th><th class="l" style="width:160px"></th></tr></thead><tbody>`;
  order.forEach(bn => {
    const x = g[bn]; if (!x.n) return;
    const canOpen = bn !== NOT_BINNED;
    h += `<tr class="${canOpen ? 'click' : ''}" ${canOpen ? `data-bin="${esc(bn)}"` : ''}><td class="l">${canOpen ? (ADM.open[bn] ? '▾ ' : '▸ ') : ''}<b>${esc(prettyBin(bn))}</b></td>${x.b.map(v => `<td${heat(v, max)}>${v || ''}</td>`).join('')}<td><b>${x.n}</b></td><td>${pct(x.n, tot)}%</td><td class="l"><div class="bar"><i style="width:${pct(x.n, tot)}%;${bn === NOT_BINNED ? 'background:#c0262d' : ''}"></i></div></td></tr>`;
    if (ADM.open[bn]) Object.entries(x.subs).sort((a, b) => b[1].reduce((p, q) => p + q) - a[1].reduce((p, q) => p + q)).forEach(([s, arr]) => {
      const n = arr.reduce((p, q) => p + q, 0);
      h += `<tr class="sub"><td class="l">${esc(s)}</td>${arr.map(v => `<td>${v || ''}</td>`).join('')}<td>${n}</td><td>${pct(n, tot)}%</td><td></td></tr>`;
    });
  });
  const colT = AGE_BUCKETS.map((_, i) => order.reduce((p, b) => p + g[b].b[i], 0));
  h += `<tr class="tot"><td class="l">Total</td>${colT.map(v => `<td>${v}</td>`).join('')}<td>${tot}</td><td>100%</td><td></td></tr></tbody></table>`;

let excelReady = null;
function loadExcel() {

const HEADER_ALIASES = { 'binning': 'Binning', 'sub binning': 'Sub Binning', 'sub-binning': 'Sub Binning', 'ccm remark': 'CCM remark', 'ccm remarks': 'CCM remark',
  'jc #': 'JC #', 'jc no': 'JC #', 'jc number': 'JC #', 'job card no': 'JC #' };
const KNOWN = EXPORT_COLS.slice(0, 24);
function canonHeader(h) {
  const k = String(h || '').replace(/\s+/g, ' ').trim().toLowerCase();
  if (HEADER_ALIASES[k]) return HEADER_ALIASES[k];
  return KNOWN.find(c => c.toLowerCase() === k) || null;
}
function cellVal(v) {
  if (v == null) return '';
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  if (typeof v === 'object') {
    if ('result' in v) return cellVal(v.result);
    if (v.richText) return v.richText.map(t => t.text).join('');
    if ('text' in v) return String(v.text);
    if (v.error) return '';
    return '';
  }
  return v;
}
let PENDING_UPLOAD = null;
function admUpload() {
  const tb = document.getElementById('tabBody');
  const today = new Date(); const iso = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  tb.innerHTML = `<div class="card"><h2>Upload daily Open JC raw data</h2>

  If the workbook also has the binning list sheet (bin names in row 1, sub-bins below), the dropdown list is updated from it.</p>
  <div class="row"><label class="f">Data date<input type="date" id="upDate" value="${iso}"></label>

}
function parseWorkbook(wb) {
  let raw = null, tax = null;
  wb.worksheets.forEach(ws => {
    if (raw && tax) return;
    for (let r = 1; r <= Math.min(10, ws.rowCount); r++) {
      const vals = []; ws.getRow(r).eachCell({ includeEmpty: true }, (c, i) => vals[i] = String(cellVal(c.value)).trim());
      const heads = vals.map(canonHeader);
      if (!raw && heads.includes('JC #') && heads.includes('Division')) { raw = { ws, row: r, heads }; return; }
    }
    if (!tax) {
      const first = []; ws.getRow(1).eachCell((c, i) => { const v = String(cellVal(c.value)).trim(); if (v) first[i] = v; });
      const names = first.filter(Boolean);
      if (names.length >= 3 && !names.some(n => canonHeader(n) === 'JC #') && names.filter(n => /_/.test(n) || ADM.tax.some(b => b.name === n)).length >= Math.ceil(names.length / 2)) {
        tax = [];
        first.forEach((n, col) => { if (!n) return; const subs = []; for (let r = 2; r <= ws.rowCount; r++) { const v = String(cellVal(ws.getCell(r, col).value)).trim(); if (v) subs.push(v); } tax.push({ name: n, subs }); });
      }
    }
  });
  if (!raw) throw new Error('Could not find the Open JC sheet – no row with "JC #" and "Division" headers in the first 10 rows.');
  const rows = [];
  for (let r = raw.row + 1; r <= raw.ws.rowCount; r++) {
    const row = raw.ws.getRow(r), o = {}; let any = false;
    raw.heads.forEach((h, i) => { if (!h) return; let v = cellVal(row.getCell(i).value); if (typeof v === 'string') v = v.replace(/\s+/g, ' ').trim(); o[h] = v; if (v !== '') any = true; });
    if (!any || !String(o['JC #'] || '').trim()) continue;
    if (o['Segment'] !== 'PV' && o['Segment'] !== 'EV') o['Segment'] = String(o['Division'] || '').charAt(0) === '3' ? 'PV' : 'EV';
    rows.push(o);
  }
  if (!rows.length) throw new Error('No JC rows found under the header.');
  const missing = ['Dealer', 'Division', 'JC Open Days', 'CCM'].filter(c => !raw.heads.includes(c));
  return { rows, tax, sheet: raw.ws.name, missing };
}

  <button class="pri" id="upGo">Confirm upload</button> <button onclick="PENDING_UPLOAD=null;admUpload()">Cancel</button>`;

    ${ADM.tax.map(b => `<tr><td class="l"><b>${esc(prettyBin(b.name))}</b></td><td class="l">${b.evOnly ? '<span class="pill ev">EV only</span>' : 'PV &amp; EV'}</td><td class="l" style="white-space:normal">${b.subs.map(esc).join(' · ')}</td></tr>`).join('')}
    </tbody></table></div></div>
  <div class="card" style="border-color:#f3c0c3"><h2 style="color:var(--red)">Delete all data</h2>
    <p class="muted">Removes all open JCs, CCM updates, closed JCs and the log from the private sheet. Your login and the CCM code stay. This cannot be undone – download the latest data first.</p>
    <div class="row"><input id="delPw" type="password" placeholder="Admin password"><input id="delCf" placeholder="Type DELETE"><button class="danger" id="delGo">Delete all data</button></div><div id="delMsg"></div></div>`;
  document.getElementById('ccSet').onclick = async () => {
    const m = document.getElementById('ccMsg');
    try { await api('setCcmCode', { token: ADM.token, code: document.getElementById('ccNew').value }); ADM.ccmCodeSet = true; m.innerHTML = '<div class="msg ok">CCM access code saved. Share it with your CCMs.</div>'; document.getElementById('ccNew').value = ''; }
    catch (e) { if (!admExpired(e)) m.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  };
  document.getElementById('pwSet').onclick = async () => {
    const m = document.getElementById('pwMsg');
    try { await api('changePassword', { token: ADM.token, oldPw: document.getElementById('pwO').value, newPw: document.getElementById('pwN').value }); m.innerHTML = '<div class="msg ok">Password changed.</div>'; }
    catch (e) { if (!admExpired(e)) m.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  };
  document.getElementById('delGo').onclick = async () => {
    const m = document.getElementById('delMsg');
    if (!confirm('Delete ALL portal data? This cannot be undone.')) return;
    try { await api('deleteAll', { token: ADM.token, pw: document.getElementById('delPw').value, confirm: document.getElementById('delCf').value.trim() }); ADM.tab = 'upload'; await admLoad(); }
    catch (e) { if (!admExpired(e)) m.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  };
}

/* ================================ start ================================ */
(IS_ADMIN ? admStart : ccmStart)();
</script>
</body>
</html>
